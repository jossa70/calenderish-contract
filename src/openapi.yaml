openapi: 3.1.0
info:
  title: Calenderish API
  version: 0.8.0
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Me]
      summary: Get the signed-in user
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/event-templates:
    get:
      operationId: listEventTemplates
      tags: [EventTemplates]
      summary: List the signed-in user's event templates
      responses:
        "200":
          description: The user's event templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventTemplate"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEventTemplate
      tags: [EventTemplates]
      summary: Create an event template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTemplateRequest"
      responses:
        "201":
          description: The created event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/event-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEventTemplate
      tags: [EventTemplates]
      summary: Get an event template
      responses:
        "200":
          description: The event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplate"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateEventTemplate
      tags: [EventTemplates]
      summary: Update an event template
      description: Existing calendar events created from the template are not affected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTemplateRequest"
      responses:
        "200":
          description: The updated event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteEventTemplate
      tags: [EventTemplates]
      summary: Delete an event template
      description: Existing calendar events created from the template are kept.
      responses:
        "204":
          description: The event template was deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [CalendarEvents]
      summary: List the signed-in user's calendar events in a date range
      description: Events are sorted by date, start time and name. An event belongs to the date it starts on.
      parameters:
        - name: from
          in: query
          required: true
          description: First date, inclusive
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last date, inclusive, at most 366 days after from
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The events in the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCalendarEvent
      tags: [CalendarEvents]
      summary: Create a calendar event from a template
      description: >-
        The event gets a copy of the template's current values, with the
        template's variables and calculations replaced by their values. A
        template without variables can only be applied once per date. A
        template with variables can be applied several times on the same date,
        but not twice with the same variable values. If Google cannot be
        reached, the event is still created with syncStatus CREATING and is
        sent to Google later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventRequest"
      responses:
        "201":
          description: The created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: The template does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Google needs to be connected again, with code GOOGLE_RECONNECT_REQUIRED. No event is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Google refused the event, with code GOOGLE_REJECTED. No event is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            The template is already applied on this date, with the same
            variable values if it has variables, with code DUPLICATE_EVENT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/calendar-events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCalendarEvent
      tags: [CalendarEvents]
      summary: Delete a calendar event
      description: >-
        Also deletes the event from Google Calendar. An event that is already
        gone from Google counts as deleted. Other events from the same template
        are not affected.
      responses:
        "202":
          description: >-
            Google could not be reached. The event now has syncStatus DELETING
            and is deleted later.
        "204":
          description: The calendar event was deleted
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: Google needs to be connected again, with code GOOGLE_RECONNECT_REQUIRED. The event is kept.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          description: Google refused to delete the event, with code GOOGLE_REJECTED. The event is kept.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LocalTime:
      description: Local time of day in 24-hour HH:mm format
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["07:00"]
    TemplateTime:
      description: >-
        A time of day in 24-hour HH:mm format, or exactly one variable or
        calculation and nothing else, such as {start=14:00} or [start + 2h].
        See EventTemplateRequest.
      type: string
      pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|\\{[^{}\\[\\]\\r\\n]{1,98}\\}|\\[[^{}\\[\\]\\r\\n]{1,98}\\])$"
      examples: ["07:00", "{start=14:00}", "[start + 2h]"]
    Label:
      description: A single line of free text
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[^\\r\\n]+$"
      examples: ["Motorvärmare"]
    Reminder:
      description: >-
        A pop-up reminder in Google Calendar, shown the given number of minutes
        before the event starts.
      type: object
      required: [minutes]
      properties:
        minutes:
          type: integer
          minimum: 0
          maximum: 40320
          examples: [30]
    EventTemplateRequest:
      description: >-
        An end time earlier than the start time means the next day. Equal start
        and end times are rejected.


        The name, the location, each label and the times can contain variables
        and calculations, which are filled in when the template is applied to
        a date. A variable is written {name} or {name=default}. A name consists
        of letters, digits and underscores, and case does not matter. Each
        variable is written in braces at most once per template. A variable
        without a default must be given a value when the template is applied.
        A calculation is written in brackets, such as [start + 2h] or
        [start - 1h30m]: a variable or an HH:mm time, followed by any number of
        added or subtracted durations in h, m or min. Its result is an HH:mm
        time that wraps around midnight. A variable can be used in calculations
        without being written in braces, and then it has no default. A variable
        that a time or a calculation uses must have a time as its value. A
        template has at most 10 variables. The characters { } [ ] are only
        allowed as part of a variable or a calculation.
      type: object
      required: [name, startTime, endTime, location, labels]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        startTime:
          $ref: "#/components/schemas/TemplateTime"
        endTime:
          $ref: "#/components/schemas/TemplateTime"
        location:
          type: string
          minLength: 1
          maxLength: 500
        labels:
          description: >-
            Free-text labels in display order. Leading and trailing whitespace
            is removed. Blank labels and labels that differ only by case are
            rejected. Use an empty list for no labels.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Label"
        reminders:
          description: >-
            Pop-up reminders. Two reminders with the same number of minutes are
            rejected. An empty list means that the event gets no reminders at
            all, not the calendar's default reminders. Absent means an empty
            list.
          type: array
          maxItems: 5
          default: []
          items:
            $ref: "#/components/schemas/Reminder"
    EventTemplate:
      description: >-
        A reusable template. An end time earlier than the start time means the
        next day. The
        fields can contain variables and calculations, see
        EventTemplateRequest.
      type: object
      required: [id, name, startTime, endTime, location, labels, reminders]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startTime:
          $ref: "#/components/schemas/TemplateTime"
        endTime:
          $ref: "#/components/schemas/TemplateTime"
        location:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        reminders:
          description: Pop-up reminders, sorted by minutes. An empty list means no reminders.
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
    CalendarEventRequest:
      type: object
      required: [templateId, date]
      properties:
        templateId:
          type: string
          format: uuid
        date:
          description: >-
            The date the event starts on. Must not be earlier than today in the
            user's time zone, or the request fails with VALIDATION_FAILED.
          type: string
          format: date
        variables:
          description: >-
            A value for each variable in the template, keyed by the variable's
            name, where case does not matter. Values are used as they are and
            are never read as variables or calculations. A value for a variable
            that a time or a calculation uses must be an HH:mm time. A missing,
            blank, invalid or unknown variable fails with VALIDATION_FAILED and
            the field variables.<name>, as does a filled-in value that breaks
            the rules of the field it ends up in. Absent means no values, which
            is enough for a template without variables.
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 200
    CalendarEvent:
      description: >-
        A copy of a template applied to a date. An end time earlier than the
        start time means the next day.
      type: object
      required: [id, date, name, startTime, endTime, location, labels, reminders, syncStatus]
      properties:
        id:
          type: string
          format: uuid
        date:
          description: The date the event starts on
          type: string
          format: date
        name:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        reminders:
          description: Pop-up reminders, sorted by minutes. An empty list means no reminders.
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        syncStatus:
          description: >-
            SYNCED when Google has the event. CREATING and DELETING mean that
            the change has not reached Google yet.
          type: string
          enum: [CREATING, SYNCED, DELETING]
        templateId:
          description: The template it was created from, absent if that template has been deleted
          type: string
          format: uuid
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        pictureUrl:
          description: The user's Google profile picture, absent if Google provides none
          type: string
          format: uri
    Problem:
      description: RFC 9457 problem details with a stable error code
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          description: >-
            Stable error code. VALIDATION_FAILED, NOT_AUTHENTICATED, NOT_FOUND,
            DUPLICATE_EVENT, GOOGLE_RECONNECT_REQUIRED, GOOGLE_REJECTED,
            REQUEST_REJECTED or INTERNAL_ERROR at this version; clients must
            tolerate new codes.
          type: string
        errors:
          description: Per-field details when code is VALIDATION_FAILED
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
