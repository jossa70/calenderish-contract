name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      OASDIFF_VERSION: 1.35.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install oasdiff
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" oasdiff
      - name: Compare with the base branch
        run: |
          git show "origin/${GITHUB_BASE_REF}:src/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base.yaml" src/openapi.yaml --fail-on ERR
