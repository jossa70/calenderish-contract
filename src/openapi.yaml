openapi: 3.1.0
info:
  title: Calenderish API
  version: 0.5.0
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Me]
      summary: Get the signed-in user
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/event-templates:
    get:
      operationId: listEventTemplates
      tags: [EventTemplates]
      summary: List the signed-in user's event templates
      responses:
        "200":
          description: The user's event templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventTemplate"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEventTemplate
      tags: [EventTemplates]
      summary: Create an event template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTemplateRequest"
      responses:
        "201":
          description: The created event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/event-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEventTemplate
      tags: [EventTemplates]
      summary: Get an event template
      responses:
        "200":
          description: The event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplate"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateEventTemplate
      tags: [EventTemplates]
      summary: Update an event template
      description: Existing calendar events created from the template are not affected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTemplateRequest"
      responses:
        "200":
          description: The updated event template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTemplate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteEventTemplate
      tags: [EventTemplates]
      summary: Delete an event template
      description: Existing calendar events created from the template are kept.
      responses:
        "204":
          description: The event template was deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/calendar-events:
    get:
      operationId: listCalendarEvents
      tags: [CalendarEvents]
      summary: List the signed-in user's calendar events in a date range
      description: Events are sorted by date, start time and name. An event belongs to the date it starts on.
      parameters:
        - name: from
          in: query
          required: true
          description: First date, inclusive
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last date, inclusive, at most 366 days after from
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The events in the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCalendarEvent
      tags: [CalendarEvents]
      summary: Create a calendar event from a template
      description: >-
        The event gets a copy of the template's current values. A template can
        only be applied once per date. If Google cannot be reached, the event
        is still created with syncStatus CREATING and is sent to Google later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventRequest"
      responses:
        "201":
          description: The created calendar event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          description: The template does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Google needs to be connected again, with code GOOGLE_RECONNECT_REQUIRED. No event is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: Google refused the event, with code GOOGLE_REJECTED. No event is created.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The template is already applied on this date, with code DUPLICATE_EVENT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/calendar-events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCalendarEvent
      tags: [CalendarEvents]
      summary: Delete a calendar event
      description: >-
        Also deletes the event from Google Calendar. An event that is already
        gone from Google counts as deleted. Other events from the same template
        are not affected.
      responses:
        "202":
          description: >-
            Google could not be reached. The event now has syncStatus DELETING
            and is deleted later.
        "204":
          description: The calendar event was deleted
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: Google needs to be connected again, with code GOOGLE_RECONNECT_REQUIRED. The event is kept.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          description: Google refused to delete the event, with code GOOGLE_REJECTED. The event is kept.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LocalTime:
      description: Local time of day in 24-hour HH:mm format
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["07:00"]
    Label:
      description: A single line of free text
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[^\\r\\n]+$"
      examples: ["Motorvärmare"]
    EventTemplateRequest:
      description: >-
        An end time earlier than the start time means the next day. Equal start
        and end times are rejected.
      type: object
      required: [name, startTime, endTime, location, labels]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
          minLength: 1
          maxLength: 500
        labels:
          description: >-
            Free-text labels in display order. Leading and trailing whitespace
            is removed. Blank labels and labels that differ only by case are
            rejected. Use an empty list for no labels.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Label"
    EventTemplate:
      description: >-
        A reusable template. An end time earlier than the start time means the
        next day.
      type: object
      required: [id, name, startTime, endTime, location, labels]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
    CalendarEventRequest:
      type: object
      required: [templateId, date]
      properties:
        templateId:
          type: string
          format: uuid
        date:
          description: The date the event starts on
          type: string
          format: date
    CalendarEvent:
      description: >-
        A copy of a template applied to a date. An end time earlier than the
        start time means the next day.
      type: object
      required: [id, date, name, startTime, endTime, location, labels, syncStatus]
      properties:
        id:
          type: string
          format: uuid
        date:
          description: The date the event starts on
          type: string
          format: date
        name:
          type: string
        startTime:
          $ref: "#/components/schemas/LocalTime"
        endTime:
          $ref: "#/components/schemas/LocalTime"
        location:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        syncStatus:
          description: >-
            SYNCED when Google has the event. CREATING and DELETING mean that
            the change has not reached Google yet.
          type: string
          enum: [CREATING, SYNCED, DELETING]
        templateId:
          description: The template it was created from, absent if that template has been deleted
          type: string
          format: uuid
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    Problem:
      description: RFC 9457 problem details with a stable error code
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          description: >-
            Stable error code. VALIDATION_FAILED, NOT_AUTHENTICATED, NOT_FOUND,
            DUPLICATE_EVENT, GOOGLE_RECONNECT_REQUIRED, GOOGLE_REJECTED,
            REQUEST_REJECTED or INTERNAL_ERROR at this version; clients must
            tolerate new codes.
          type: string
        errors:
          description: Per-field details when code is VALIDATION_FAILED
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
